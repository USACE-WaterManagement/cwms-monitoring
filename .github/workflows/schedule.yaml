name: Schedule
on:
  schedule:
    # Grafana and such generally publishes updates Monday each we,
    - cron: "0 7 * * 2"
  workflow_dispatch:

jobs:
  dev:
    permissions:
      packages: write
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      branch: "main"
      nightly: true
  # Deploy Monitoring images weekly to dev.
  deploy-dev:
    permissions:
      id-token: write
      contents: read
    needs: dev
    environment: cwbi-dev
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        uses: usace-watermanagement/cwms-monitoring/.github/actions/deploy@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: dev-nightly
          region: ${{secrets.REGION}}
          iam_role: ${{secrets.DEPLOY_ROLE}}
          activation_tag: ${{secrets.ACTIVATION_TAG}}
          activate: true