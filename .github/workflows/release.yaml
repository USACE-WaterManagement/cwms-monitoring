---
name: Release
on:
  workflow_call:
    inputs:
      branch:
       type: string
       required: true
      nightly:
        type: boolean
        required: true
    secrets:
      token:
       required: false
    outputs:
      grafana_image:
        description: Grafana image tag for downstream consumption
        value: ${{ jobs.release.outputs.grafana_image }}
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        required: true
        description: Which Branch to make the build from
        options:
          - main
      nightly:
        type: boolean
        required: true
        description: Is this part of a "nightly" workflow?
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
        packages: write
        contents: write
    outputs:
      grafana_image: ${{steps.build_image.outputs.grafana_image}}
    steps:
      - name: checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{inputs.branch}}
      - name: Set version
        id: version
        if: inputs.nightly == true
        run: |
          if [ "${{inputs.nightly}}" == "true" ]; then
            echo "VERSION=${{inputs.branch}}-nightly" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{inputs.branch}}" >> $GITHUB_OUTPUT
          fi
      - name: Log in to the Container registry
        id: login-ghcr
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token != null && secrets.token || secrets.GITHUB_TOKEN }}
      - name: Build docker image
        id: build_image
        env:
          VERSION: ${{steps.version.outputs.VERSION}}
        run: |
          REPO=`echo "${{github.repository}}" | tr  '[:upper:]' '[:lower:]'`
          # Create and push images
          if [ "${{inputs.nightly}}" == "true" ]; then
            # Scheduled build, try the latest one.
            # NOTE: this works, but could be brittle as-is. Should probably be moved to an action
            # and pages looped through to be sure.
            # may also make sense to move to secret and let the schedule do this part.
            GRAFANA_VERSION=$(curl https://hub.docker.com/v2/repositories/grafana/grafana/tags?page_size=100 | jq -r '.results[].name' | grep "13\.2\.[0-9][0-9]*$" | head -1)
            docker build --build-arg GRAFANA_VERSION=${GRAFANA_VERSION} -t grafana:build-latest services/grafana          
          else
            use the configured version
            docker build --build-arg GRAFANA_VERSION=${{secrets.GRAFANA_VERSION}} -t grafana:build-latest services/grafana          
          fi
          docker tag grafana:build-latest ghcr.io/${REPO}/cwms-monitoring/grafana:$VERSION
          docker push ghcr.io/${REPO}/cwms-monitoring/grafana:$VERSION          
          
          # Set output.
          echo "grafana_image=ghcr.io/${REPO}/cwms-monitoring/grafana:$VERSION" >> $GITHUB_OUTPUT
          
      - name: Logout of GH registry
        if: ${{ always() }}
        run: |
          docker logout ${{ steps.login-ghcr.outputs.registry }}